name: Build

# Runs on every push to main, on every pull request, and can also be
# triggered manually from the GitHub UI ("Run workflow" button) via
# workflow_dispatch. The "tags" trigger below is what additionally kicks
# off the release job further down: pushing a tag like "v1.2.0" builds
# exactly the same way AND publishes a GitHub Release with the binaries
# attached.
#
# "paths" restricts push/pull_request runs to only fire when something
# that actually affects the BUILT PROGRAM changed - source code, the
# dependency manifest/lockfile, or this workflow file itself - so editing
# just the README, CHANGELOG, or LICENSE doesn't spend CI minutes on a
# rebuild that would produce byte-for-byte the same binaries anyway.
#
# IMPORTANT: this "paths" filter is deliberately NOT applied to tag
# pushes - GitHub Actions ignores path filters for tag events entirely
# (undocumented, but confirmed behavior), so a "vX.Y.Z" tag always
# triggers a full build + release below, regardless of what the most
# recent commit touched. That's exactly what we want: tagging a release
# is an explicit signal to publish, independent of the paths filter that
# only exists to reduce noise on everyday doc-only commits.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  # Builds a native release binary on real Windows, macOS, and Linux
  # runners - not a cross-compile from a single OS, but three genuinely
  # separate machines, each building for itself. That's what guarantees
  # the result actually works on each platform.
  build:
    name: Build (${{ matrix.os }})
    strategy:
      # fail-fast: false means if e.g. the Windows build fails, the macOS
      # and Linux builds still run to completion instead of being
      # cancelled - useful for seeing all three results at once.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Caches ~/.cargo and target/ between runs, keyed by Cargo.lock.
      # Without this, every run recompiles every dependency from scratch,
      # which costs both time and (on a private repo) billed minutes.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: img2ico-${{ matrix.os }}
          # Only one of these two paths will actually exist per OS -
          # if-no-files-found: ignore stops that from being treated as an
          # error for the other platform's job.
          path: |
            target/release/img2ico
            target/release/img2ico.exe
          if-no-files-found: ignore

  # Bonus verification step: generates a real .icns file on an actual
  # macOS runner, then decomposes it again using Apple's OWN "iconutil"
  # tool. If Apple's own tooling can successfully unpack the file we
  # produced, that's about as strong a real-world confirmation of the
  # .icns format as we can get without a person physically checking it in
  # Finder - see the img2ico README/write_icns() doc comment for the full
  # context on why this mattered (the format was originally verified
  # without any access to a real Mac at all).
  verify-icns-on-macos:
    name: Verify .icns with native macOS tools
    needs: build
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Generate a test .icns file
        run: ./target/release/img2ico .github/testdata/logo.png --output-format icns -o test.icns --force

      - name: Decompose the .icns with Apple's own iconutil
        run: |
          iconutil -c iconset test.icns -o verified.iconset
          echo "iconutil successfully unpacked the .icns file - contents:"
          ls -la verified.iconset

      - name: Inspect with sips (macOS's built-in image tool)
        run: sips -g all test.icns

      - name: Upload the generated .icns and its decomposed iconset
        uses: actions/upload-artifact@v6
        with:
          name: icns-verification
          path: |
            test.icns
            verified.iconset

  # Only runs when the trigger was a version tag (e.g. "v1.2.0"), not on
  # ordinary pushes to main or pull requests - see the "tags" trigger
  # above. Publishes a proper GitHub Release with the three platform
  # binaries attached as downloadable assets: permanent, publicly
  # linkable, no login required, and prominently shown on the repo's main
  # page - unlike the plain build artifacts above, which expire and
  # require being logged in to even find.
  release:
    name: Publish GitHub Release
    needs: [build, verify-icns-on-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is often read-only for repository contents
    # depending on the repo's settings - creating a Release requires
    # explicit write access, so this is spelled out rather than assumed.
    permissions:
      contents: write
    steps:
      - name: Download all three platform artifacts from the build job
        uses: actions/download-artifact@v7
        with:
          pattern: img2ico-*
          path: artifacts

      # macOS and Linux both produce a binary simply named "img2ico" (no
      # extension) - if we uploaded both as-is, they'd collide as release
      # assets, since a Release can't have two files with the same name.
      # Renaming each to include its platform makes them all distinct.
      - name: Rename each binary so they don't collide as release assets
        run: |
          mkdir -p release
          mv artifacts/img2ico-windows-latest/img2ico.exe release/img2ico-windows.exe
          mv artifacts/img2ico-macos-latest/img2ico release/img2ico-macos
          mv artifacts/img2ico-ubuntu-latest/img2ico release/img2ico-linux
          chmod +x release/img2ico-macos release/img2ico-linux

      - name: Create the GitHub Release with the binaries attached
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          # Auto-fills the release description from the commits since the
          # previous tag, instead of requiring a hand-written changelog
          # for every release.
          generate_release_notes: true